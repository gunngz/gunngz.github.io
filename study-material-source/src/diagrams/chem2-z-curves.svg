 <title id="z-curve-title">Z curve with explanations at low pressure, where attractions dominate, and at very high pressure</title><desc id="z-curve-description">The dashed ideal-gas line is Z equals 1. A schematic real-gas curve approaches 1 at low pressure, dips below 1 where attractions dominate, and rises above 1 where finite particle volume and short-range repulsions dominate. Each region has an attached three-step explanation and compares pressures at the same temperature, volume, and number of moles.</desc><metadata>
