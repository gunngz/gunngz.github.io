<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" role="img" aria-labelledby="title desc">
  <title id="title">Marginal relative frequency</title>
  <desc id="desc">An illustrative two-way table highlights the Group A row total of 10 and the overall sample size of 40. The marginal relative frequency of Group A is 10 divided by 40, or 25 percent.</desc>
  <rect width="1000" height="340" rx="24" fill="#f8f1e5"/>
  <text x="42" y="48" fill="#282720" font-family="Inter, -apple-system, BlinkMacSystemFont, system-ui, sans-serif" font-size="25" font-weight="700">Marginal relative frequency</text>
  <text x="42" y="78" fill="#716d62" font-family="Inter, -apple-system, BlinkMacSystemFont, system-ui, sans-serif" font-size="16">Illustrative counts · use a row or column total over the overall sample size</text>
  <rect x="42" y="104" width="490" height="178" rx="12" fill="#fffaf1" stroke="#e5dac9" stroke-width="2"/>
  <rect x="42" y="104" width="490" height="46" rx="12" fill="#e4e9dd"/>
  <rect x="42" y="150" width="490" height="44" fill="#f1dfaa"/>
  <rect x="425" y="151" width="106" height="42" rx="7" fill="#f1dfaa" stroke="#bd9d48" stroke-width="2"/>
  <rect x="425" y="240" width="106" height="41" rx="7" fill="#d9eaf5" stroke="#739db3" stroke-width="2"/>
  <g stroke="#e5dac9" stroke-width="1.5"><line x1="42" y1="150" x2="532" y2="150"/><line x1="42" y1="194" x2="532" y2="194"/><line x1="42" y1="238" x2="532" y2="238"/><line x1="190" y1="104" x2="190" y2="282"/><line x1="308" y1="104" x2="308" y2="282"/></g>
  <g fill="#282720" font-family="Inter, -apple-system, BlinkMacSystemFont, system-ui, sans-serif" font-size="16" text-anchor="middle">
    <text x="116" y="134" font-weight="700">Group</text><text x="249" y="134" font-weight="700">Outcome 1</text><text x="367" y="134" font-weight="700">Outcome 2</text><text x="478" y="134" font-weight="700">Total</text>
    <text x="116" y="179" text-anchor="start" font-weight="700">Group A</text><text x="249" y="179">3</text><text x="367" y="179">7</text><text x="478" y="179" font-weight="700">10</text>
    <text x="116" y="223" text-anchor="start">Group B</text><text x="249" y="223">18</text><text x="367" y="223">12</text><text x="478" y="223">30</text>
    <text x="116" y="267" text-anchor="start" font-weight="700">Total</text><text x="249" y="267">21</text><text x="367" y="267">19</text><text x="478" y="267" font-weight="700">40</text>
  </g>
  <path d="M552 173h42m-10-10 10 10-10 10" fill="none" stroke="#526f5c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="615" y="114" width="343" height="164" rx="16" fill="#fffaf1" stroke="#e5dac9" stroke-width="2"/>
  <text x="642" y="152" fill="#526f5c" font-family="Inter, -apple-system, BlinkMacSystemFont, system-ui, sans-serif" font-size="15" font-weight="700">GROUP A IN THE FULL SAMPLE</text>
  <text x="786" y="207" text-anchor="middle" fill="#282720" font-family="Inter, -apple-system, BlinkMacSystemFont, system-ui, sans-serif" font-size="34" font-weight="700">10 ÷ 40 = 25%</text>
  <text x="786" y="244" text-anchor="middle" fill="#716d62" font-family="Inter, -apple-system, BlinkMacSystemFont, system-ui, sans-serif" font-size="16">row total ÷ overall sample size</text>
</svg>
