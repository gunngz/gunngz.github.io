<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 390" role="img" aria-labelledby="title desc">
  <title id="title">Interpreting a simulation dotplot</title>
  <desc id="desc">Eight illustrative repetitions each contain 20 attempts. Each dot records the number of successes in one complete repetition. The highlighted dot at four means four successes in one repetition of 20 attempts.</desc>
  <rect width="900" height="390" rx="22" fill="#f8f1e5"/>
  <g font-family="Inter, -apple-system, BlinkMacSystemFont, system-ui, sans-serif">
    <text x="40" y="48" fill="#282720" font-size="25" font-weight="700">Simulation results</text>
    <text x="40" y="80" fill="#716d62" font-size="17">Illustrative: 8 repetitions, 20 attempts in each repetition</text>
    <path d="M80 291H520" stroke="#928b7d" stroke-width="2"/>
    <g fill="#526f62">
      <circle cx="100" cy="264" r="12"/>
      <circle cx="180" cy="264" r="12"/><circle cx="180" cy="226" r="12"/>
      <circle cx="260" cy="264" r="12"/><circle cx="260" cy="226" r="12"/><circle cx="260" cy="188" r="12"/>
      <circle cx="340" cy="264" r="12"/>
    </g>
    <circle cx="420" cy="264" r="14" fill="#f1dfaa" stroke="#a88638" stroke-width="2"/>
    <g fill="#282720" text-anchor="middle" font-size="18">
      <text x="100" y="322">0</text><text x="180" y="322">1</text><text x="260" y="322">2</text>
      <text x="340" y="322">3</text><text x="420" y="322">4</text><text x="500" y="322">5</text>
    </g>
    <text x="300" y="360" text-anchor="middle" fill="#716d62" font-size="17">Successes in 20 attempts</text>
    <path d="M437 256L550 205" stroke="#a88638" stroke-width="2" fill="none"/>
    <rect x="550" y="130" width="310" height="170" rx="16" fill="#fffaf1" stroke="#e6dac5" stroke-width="2"/>
    <text x="574" y="165" fill="#526f62" font-size="18" font-weight="700">ONE DOT AT 4</text>
    <g fill="#282720" font-size="18">
      <text x="574" y="205">In one repetition of</text>
      <text x="574" y="233">20 attempts, 4 successes</text>
      <text x="574" y="261">occurred.</text>
    </g>
  </g>
</svg>
