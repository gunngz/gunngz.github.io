<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" role="img" aria-labelledby="title desc">
  <title id="title">Diagnostic test outcomes and condition groups</title>
  <desc id="desc">Columns show whether the condition is actually present or absent. Rows show positive and negative test results. Sensitivity uses the condition-present column; specificity uses the condition-absent column.</desc>
  <rect width="900" height="430" rx="22" fill="#f8f1e5"/>
  <g font-family="Inter, -apple-system, BlinkMacSystemFont, system-ui, sans-serif">
    <text x="40" y="48" fill="#282720" font-size="25" font-weight="700">Diagnostic test outcomes</text>
    <text x="40" y="78" fill="#716d62" font-size="17">The actual condition determines the comparison group.</text>
    <rect x="240" y="140" width="300" height="72" fill="#e4e9dc"/>
    <rect x="540" y="140" width="300" height="72" fill="#f1dfaa"/>
    <rect x="240" y="212" width="300" height="72" fill="#f1dfaa"/>
    <rect x="540" y="212" width="300" height="72" fill="#e4e9dc"/>
    <rect x="240" y="140" width="600" height="144" rx="8" fill="none" stroke="#dcd1bc" stroke-width="2"/>
    <path d="M540 140V284M240 212H840" stroke="#dcd1bc" stroke-width="2"/>
    <g fill="#282720" font-size="20" font-weight="700" text-anchor="middle">
      <text x="390" y="120">Condition present</text><text x="690" y="120">Condition absent</text>
      <text x="390" y="183">True positive</text><text x="690" y="183">False positive</text>
      <text x="390" y="255">False negative</text><text x="690" y="255">True negative</text>
    </g>
    <g fill="#282720" font-size="20" font-weight="600">
      <text x="50" y="183">Positive test</text><text x="50" y="255">Negative test</text>
    </g>
    <rect x="40" y="318" width="400" height="78" rx="13" fill="#fffaf1" stroke="#e6dac5" stroke-width="2"/>
    <rect x="460" y="318" width="400" height="78" rx="13" fill="#fffaf1" stroke="#e6dac5" stroke-width="2"/>
    <g fill="#526f62" font-size="19" font-weight="700">
      <text x="62" y="349">Sensitivity</text><text x="482" y="349">Specificity</text>
    </g>
    <g fill="#716d62" font-size="17">
      <text x="62" y="378">Use everyone with the condition.</text>
      <text x="482" y="378">Use everyone without the condition.</text>
    </g>
  </g>
</svg>
