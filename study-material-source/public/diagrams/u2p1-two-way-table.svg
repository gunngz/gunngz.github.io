<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" role="img" aria-labelledby="title desc">
  <title id="title">Two-way table</title>
  <desc id="desc">An illustrative two-way table crosses group membership with Outcome 1 and Outcome 2. Each interior cell gives the count for one combination, and the final row and column show marginal totals.</desc>
  <rect width="1000" height="340" rx="24" fill="#f7f1e5"/>
  <text x="42" y="48" fill="#302e29" font-family="Arial, sans-serif" font-size="25" font-weight="700">Two-way table</text>
  <text x="42" y="78" fill="#777166" font-family="Arial, sans-serif" font-size="16">Illustrative counts · each interior cell combines one row category and one column category</text>
  <rect x="42" y="104" width="650" height="188" rx="12" fill="#fffaf1" stroke="#e5dac9" stroke-width="2"/>
  <rect x="42" y="104" width="650" height="49" rx="12" fill="#e4e9dd"/>
  <rect x="42" y="153" width="650" height="46" fill="#f8f3e9"/>
  <rect x="42" y="245" width="650" height="47" fill="#f1dfaa"/>
  <g stroke="#dfd3bf" stroke-width="1.5">
    <line x1="42" y1="153" x2="692" y2="153"/><line x1="42" y1="199" x2="692" y2="199"/><line x1="42" y1="245" x2="692" y2="245"/>
    <line x1="242" y1="104" x2="242" y2="292"/><line x1="392" y1="104" x2="392" y2="292"/><line x1="542" y1="104" x2="542" y2="292"/>
  </g>
  <g fill="#302e29" font-family="Arial, sans-serif" font-size="18" text-anchor="middle">
    <text x="142" y="136" font-weight="700">Group</text><text x="317" y="136" font-weight="700">Outcome 1</text><text x="467" y="136" font-weight="700">Outcome 2</text><text x="617" y="136" font-weight="700">Row total</text>
    <text x="142" y="183" text-anchor="start" font-weight="700">Group A</text><text x="317" y="183">3</text><text x="467" y="183">7</text><text x="617" y="183" font-weight="700">10</text>
    <text x="142" y="229" text-anchor="start" font-weight="700">Group B</text><text x="317" y="229">18</text><text x="467" y="229">12</text><text x="617" y="229" font-weight="700">30</text>
    <text x="142" y="276" text-anchor="start" font-weight="700">Column total</text><text x="317" y="276" font-weight="700">21</text><text x="467" y="276" font-weight="700">19</text><text x="617" y="276" font-weight="700">40</text>
  </g>
  <rect x="728" y="116" width="230" height="160" rx="16" fill="#fffaf1" stroke="#e5dac9" stroke-width="2"/>
  <text x="754" y="155" fill="#526f5c" font-family="Arial, sans-serif" font-size="15" font-weight="700">READ THE TABLE</text>
  <text x="754" y="192" fill="#302e29" font-family="Arial, sans-serif" font-size="17">Interior cell</text>
  <text x="754" y="216" fill="#716d62" font-family="Arial, sans-serif" font-size="15">one combination</text>
  <line x1="754" y1="230" x2="930" y2="230" stroke="#e5dac9" stroke-width="1.5"/>
  <text x="754" y="258" fill="#302e29" font-family="Arial, sans-serif" font-size="17">Totals</text>
  <text x="930" y="258" fill="#716d62" font-family="Arial, sans-serif" font-size="15" text-anchor="end">marginal counts</text>
</svg>
