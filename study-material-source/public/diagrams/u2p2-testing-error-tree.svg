 <title id="chart-title">Complete disease-testing probability tree</title><desc id="chart-desc">The disease branch has probability p and the no-disease branch has probability 1 minus p. Given disease, positive and negative probabilities are 1 minus beta and beta. Given no disease, positive and negative probabilities are alpha and 1 minus alpha. The four endpoint products are p times 1 minus beta, p times beta, 1 minus p times alpha, and 1 minus p times 1 minus alpha.</desc><style>text { font-family: Inter, -apple-system, BlinkMacSystemFont, system-ui, sans-serif !important; }</style><metadata>
