<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" role="img" aria-labelledby="title desc">
  <title id="title">Segmented bar chart and mosaic plot</title>
  <desc id="desc">A segmented bar chart uses equal-width bars. A mosaic plot uses widths proportional to group size. In both, segment heights show conditional proportions.</desc>
  <rect width="1000" height="430" rx="24" fill="#f7f1e5"/>
  <text x="42" y="48" fill="#302e29" font-family="Arial, sans-serif" font-size="24" font-weight="700">Same conditional proportions · different bar widths</text>
  <line x1="500" y1="72" x2="500" y2="392" stroke="#dfd3bf" stroke-width="2"/>
  <text x="54" y="91" fill="#526f62" font-family="Arial, sans-serif" font-size="19" font-weight="700">SEGMENTED BAR CHART</text>
  <text x="540" y="91" fill="#526f62" font-family="Arial, sans-serif" font-size="19" font-weight="700">MOSAIC PLOT</text>
  <text x="54" y="119" fill="#777166" font-family="Arial, sans-serif" font-size="14">Equal widths · each bar totals 100%</text>
  <text x="540" y="119" fill="#777166" font-family="Arial, sans-serif" font-size="14">Widths show group size · total area shows sample share</text>
  <g stroke="#d3c8b7" stroke-width="1">
    <line x1="87" y1="156" x2="455" y2="156"/><line x1="87" y1="249" x2="455" y2="249"/><line x1="87" y1="342" x2="455" y2="342"/>
  </g>
  <g fill="#777166" font-family="Arial, sans-serif" font-size="13" text-anchor="end">
    <text x="78" y="161">100%</text><text x="78" y="254">50%</text><text x="78" y="347">0%</text>
  </g>
  <g>
    <rect x="112" y="156" width="86" height="74" fill="#78a98e"/><rect x="112" y="230" width="86" height="112" fill="#a9c9d6"/>
    <rect x="226" y="156" width="86" height="130" fill="#78a98e"/><rect x="226" y="286" width="86" height="56" fill="#a9c9d6"/>
    <rect x="340" y="156" width="86" height="93" fill="#78a98e"/><rect x="340" y="249" width="86" height="93" fill="#a9c9d6"/>
    <g fill="#625d54" font-family="Arial, sans-serif" font-size="14" text-anchor="middle"><text x="155" y="365">Group A</text><text x="269" y="365">Group B</text><text x="383" y="365">Group C</text></g>
  </g>
  <g>
    <rect x="558" y="156" width="78" height="74" fill="#78a98e"/><rect x="558" y="230" width="78" height="112" fill="#a9c9d6"/>
    <rect x="636" y="156" width="144" height="130" fill="#78a98e"/><rect x="636" y="286" width="144" height="56" fill="#a9c9d6"/>
    <rect x="780" y="156" width="112" height="93" fill="#78a98e"/><rect x="780" y="249" width="112" height="93" fill="#a9c9d6"/>
    <g fill="#625d54" font-family="Arial, sans-serif" font-size="14" text-anchor="middle"><text x="597" y="365">A</text><text x="708" y="365">B</text><text x="836" y="365">C</text></g>
  </g>
  <g font-family="Arial, sans-serif" font-size="14" fill="#555147">
    <rect x="310" y="391" width="14" height="14" rx="3" fill="#78a98e"/><text x="331" y="403">Response 1</text>
    <rect x="417" y="391" width="14" height="14" rx="3" fill="#a9c9d6"/><text x="438" y="403">Response 2</text>
  </g>
  <text x="551" y="403" fill="#777166" font-family="Arial, sans-serif" font-size="13">Group size: small → large → medium</text>
</svg>
