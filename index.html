<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Learning Pages</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #302f2a;
      --quiet: #777368;
      --paper: #f4eedf;
      --surface: #fffaf1;
      --line: #e7dcc8;
      --accent: #587565;
    }
    * { box-sizing: border-box; }
    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    main {
      width: min(100% - 48px, 1120px);
      margin: 0 auto;
      padding: clamp(36px, 7vw, 84px) 0;
    }
    h1 {
      margin: 0 0 28px;
      font-size: clamp(1.8rem, 4vw, 2.4rem);
      line-height: 1.2;
      font-weight: 650;
      letter-spacing: -.025em;
    }
    .page-link {
      display: flex;
      min-height: 96px;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      padding: 22px 26px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--surface);
      color: inherit;
      text-decoration: none;
      box-shadow: 0 2px 5px rgb(63 51 31 / 5%);
      transition: border-color .15s ease, transform .15s ease;
    }
    .page-link:hover {
      border-color: var(--accent);
      transform: translateY(-1px);
    }
    .page-link:focus-visible {
      outline: 3px solid rgb(88 117 101 / 35%);
      outline-offset: 3px;
    }
    .page-name { display: block; font-size: 1.15rem; font-weight: 650; }
    .page-detail { display: block; margin-top: 5px; color: var(--quiet); font-size: .92rem; }
    .arrow { width: 20px; height: 20px; flex: none; color: var(--accent); }
    @media (max-width: 560px) {
      main { width: min(100% - 32px, 1120px); }
      .page-link { min-height: 82px; padding: 18px; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Learning Pages</h1>
    <a class="page-link" href="/ap-statistics/">
      <span>
        <span class="page-name">AP Statistics</span>
        <span class="page-detail">Unit 1 · Part 1 and Part 2</span>
      </span>
      <svg class="arrow" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M5 12h14m-6-6 6 6-6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </a>
  </main>
</body>
</html>
