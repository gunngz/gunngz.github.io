name: Publish Learning Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: study-material-source/package-lock.json
      - name: Install dependencies and build the study guides
        working-directory: study-material-source
        run: npm ci && npm run build
        env:
          GITHUB_PAGES: "true"
      - name: Assemble the homepage, Statistics, and Chemistry pages
        run: |
          mkdir -p _site/ap-statistics _site/ap-chemistry
          rsync -a --exclude='/.git/' --exclude='/.github/' --exclude='/study-material-source/' --exclude='/node_modules/' --exclude='/dist/' --exclude='/_site/' ./ _site/
          cp -a study-material-source/dist/. _site/ap-statistics/
          cp -a study-material-source/dist/. _site/ap-chemistry/
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
